<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Art of Battle — a duel</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #0a0c12;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    cursor: crosshair;
  }
  canvas { display: block; position: absolute; inset: 0; }
  #hud { pointer-events: none; z-index: 3; }

  /* Vignette + a faint warm grade, cheaper than a post pass. */
  #grade {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.55) 100%),
      linear-gradient(180deg, rgba(20,14,10,0.10), rgba(4,6,12,0.22));
  }

  #loading {
    position: absolute; inset: 0; z-index: 10; display: grid; place-content: center;
    gap: 14px; text-align: center; background: #0a0c12; color: #cbd4e2;
    transition: opacity .6s ease; letter-spacing: 3px;
  }
  #loading.gone { opacity: 0; pointer-events: none; }
  #loading h1 { font-size: 15px; font-weight: 600; letter-spacing: 8px; opacity: .85; }
  #loading p { font-size: 12px; opacity: .5; letter-spacing: 2px; }
  .blade {
    width: 200px; height: 2px; margin: 0 auto;
    background: linear-gradient(90deg, transparent, #7f8ea6, transparent);
    animation: sweep 1.4s ease-in-out infinite;
  }
  @keyframes sweep { 0%,100% { transform: scaleX(.25); opacity:.4 } 50% { transform: scaleX(1); opacity:1 } }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="grade"></div>
  <canvas id="hud"></canvas>
  <div id="loading">
    <h1>ART OF BATTLE</h1>
    <div class="blade"></div>
    <p>FORGING THE ARENA</p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
